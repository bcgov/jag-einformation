name: Build & Push Einformation to Artifactory
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs: 
      tag: 
        description: "Image tag/branch to use"
        required: true
        type: string

env:
  IMAGE_NAME: einformation
  WORKING_DIRECTORY: .
  IMAGE_TAG: test
  BRANCH_NAME: test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code at the chosen tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Login to Artifactory
        uses: docker/login-action@v1
        with:
          registry: artifacts.developer.gov.bc.ca
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      # Get SHORT_SHA to tag images
      - name: Get short SHA
        id: short_sha
        run: |
          echo "::set-output name=SHORT_SHA::$(git rev-parse --short HEAD)"
          echo "Short SHA: $SHORT_SHA"

      - name: Docker Pull and Tag Einfo Image
        working-directory: ${{env.WORKING_DIRECTORY}}
        run: |
          docker pull artifacts.developer.gov.bc.ca/eb59-einformation/jag-${{ env.IMAGE_NAME }}:dev
          docker tag artifacts.developer.gov.bc.ca/eb59-einformation/jag-${{ env.IMAGE_NAME }}:dev artifacts.developer.gov.bc.ca/eb59-einformation/jag-${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
  
      - name: Docker Push to Artifactory
        id: publish
        run: |
          docker push artifacts.developer.gov.bc.ca/eb59-einformation/jag-${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
      
      - name: Set GitOps SSH Key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSHKEY }}

      - name: Update Helm Values and Commit
        id: helm
        run: |
          
          # Commit and push the changes
          git config --global user.email "actions@github.com"
          git config --global user.name "EInfo GitHub Actions"
          git clone -b ${{ env.BRANCH_NAME }} --single-branch git@github.com:bcgov-c/tenant-gitops-b59d8b.git
          
          # Navigate to the directory containing your Helm values file for the environment develop -> DEV, test -> test
          cd tenant-gitops-b59d8b/charts

          # Update the Helm values file with the new image tag and version
          DATETIME=$(date +'%Y-%m-%d %H:%M:%S')  # Get current date and time

          sed -i "s/tag: .*/tag: ${{ env.IMAGE_TAG }} # Image Updated on $DATETIME/" ../deploy/${{ env.IMAGE_TAG }}_values.yaml
          sed -i "s/version: .*/version: ${{ steps.short_sha.outputs.SHORT_SHA }} # Version Updated on $DATETIME/" ../deploy/${{ env.IMAGE_TAG }}_values.yaml
           
          git add .
          
          git add ../deploy/${{ env.IMAGE_TAG }}_values.yaml
          
          # Repackage Helm Chart      

          cd gitops

          helm dependency build
          
          cd charts

          git add .
          
          git commit -m "Update ${{ env.IMAGE_TAG }} Einfo image tag"
          git push origin ${{ env.BRANCH_NAME }} # Update the branch name as needed